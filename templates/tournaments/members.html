{% extends 'base.html' %}
{% block content %}
<h1>Participantes</h1>
<p class="text-muted">{{ tournament.name }}</p>
<ul class="list-group">
  {% for membership in memberships %}
    <li class="list-group-item d-flex justify-content-between align-items-center gap-3">
      <a class="link-strong" href="{% url 'tournaments:member_predictions' tournament.slug membership.user.id %}">{{ membership.user.username }}</a>
      <span class="badge-accent"><i aria-hidden="true" class="bi bi-person-badge"></i> {{ membership.get_role_display }}</span>
    </li>
  {% empty %}
    <li class="list-group-item">No hay participantes.</li>
  {% endfor %}
</ul>
{% endblock %}
