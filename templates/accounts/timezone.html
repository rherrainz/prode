{% extends 'base.html' %}
{% block title %}Zona horaria{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Zona horaria</h1>
  <p class="text-muted">Usamos esta zona horaria para mostrarte los partidos en tu horario.</p>
  <form method="post" class="stacked-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit"><i aria-hidden="true" class="bi bi-check2"></i> Guardar</button>
  </form>
</div>
{% endblock %}
